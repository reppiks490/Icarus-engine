name: atlas-secret-presence-audit

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/atlas-secret-presence-audit.yml']

permissions:
  contents: read

jobs:
  presence-only:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential storage class without values
        env:
          ALPHAVANTAGE_SECRET: ${{ secrets.ALPHAVANTAGE_API_KEY != '' || secrets.ALPHA_VANTAGE_API_KEY != '' || secrets.ALPHA_VANTAGE_KEY != '' }}
          ALPHAVANTAGE_VAR: ${{ vars.ALPHAVANTAGE_API_KEY != '' || vars.ALPHA_VANTAGE_API_KEY != '' || vars.ALPHA_VANTAGE_KEY != '' }}
          DATABENTO_SECRET: ${{ secrets.DATABENTO_API_KEY != '' || secrets.DATABENTO_KEY != '' }}
          DATABENTO_VAR: ${{ vars.DATABENTO_API_KEY != '' || vars.DATABENTO_KEY != '' }}
          DATABENTO_SECONDARY_SECRET: ${{ secrets.DATABENTO_API_KEY_SECONDARY != '' }}
          DATABENTO_SECONDARY_VAR: ${{ vars.DATABENTO_API_KEY_SECONDARY != '' }}
          DATABENTO_THIRD_SECRET: ${{ secrets.DATABENTO_API_KEY_THIRD != '' }}
          DATABENTO_THIRD_VAR: ${{ vars.DATABENTO_API_KEY_THIRD != '' }}
          DATABENTO_FOURTH_SECRET: ${{ secrets.DATABENTO_API_KEY_FOURTH != '' }}
          DATABENTO_FOURTH_VAR: ${{ vars.DATABENTO_API_KEY_FOURTH != '' }}
          EODHD_SECRET: ${{ secrets.EODHD_API_TOKEN != '' || secrets.EODHD_API_KEY != '' || secrets.EODHD_KEY != '' || secrets.EOD_API_KEY != '' }}
          EODHD_VAR: ${{ vars.EODHD_API_TOKEN != '' || vars.EODHD_API_KEY != '' || vars.EODHD_KEY != '' || vars.EOD_API_KEY != '' }}
          FINNHUB_SECRET: ${{ secrets.FINNHUB_API_KEY != '' || secrets.FINNHUB_KEY != '' }}
          FINNHUB_VAR: ${{ vars.FINNHUB_API_KEY != '' || vars.FINNHUB_KEY != '' }}
          FMP_SECRET: ${{ secrets.FMP_API_KEY != '' || secrets.FMP_KEY != '' }}
          FMP_VAR: ${{ vars.FMP_API_KEY != '' || vars.FMP_KEY != '' }}
          FRED_SECRET: ${{ secrets.FRED_API_KEY != '' || secrets.FRED_KEY != '' }}
          FRED_VAR: ${{ vars.FRED_API_KEY != '' || vars.FRED_KEY != '' }}
          MASSIVE_SECRET: ${{ secrets.MASSIVE_API_KEY != '' || secrets.MASSIVE != '' || secrets.MASSIVE_API_TOKEN != '' || secrets.MASSIVE_KEY != '' || secrets.MASSIVE_TOKEN != '' || secrets.POLYGON_API_KEY != '' || secrets.POLYGON_IO_API_KEY != '' || secrets.POLYGON_KEY != '' || secrets.POLYGON_TOKEN != '' || secrets.POLYGON != '' }}
          MASSIVE_VAR: ${{ vars.MASSIVE_API_KEY != '' || vars.MASSIVE != '' || vars.MASSIVE_API_TOKEN != '' || vars.MASSIVE_KEY != '' || vars.MASSIVE_TOKEN != '' || vars.POLYGON_API_KEY != '' || vars.POLYGON_IO_API_KEY != '' || vars.POLYGON_KEY != '' || vars.POLYGON_TOKEN != '' || vars.POLYGON != '' }}
          TIINGO_SECRET: ${{ secrets.TIINGO_API_TOKEN != '' || secrets.TIINGO_API_KEY != '' || secrets.TIINGO_KEY != '' || secrets.TIINGO_TOKEN != '' }}
          TIINGO_VAR: ${{ vars.TIINGO_API_TOKEN != '' || vars.TIINGO_API_KEY != '' || vars.TIINGO_KEY != '' || vars.TIINGO_TOKEN != '' }}
          TWELVE_SECRET: ${{ secrets.TWELVEDATA_API_KEY != '' || secrets.TWELVEDATA != '' || secrets.TWELVEDATA_KEY != '' || secrets.TWELVE_API_KEY != '' || secrets.TWELVE_DATA != '' || secrets.TWELVE_DATA_API_KEY != '' || secrets.TWELVE_DATA_KEY != '' || secrets.TWELVE_KEY != '' || secrets.TD_API_KEY != '' }}
          TWELVE_VAR: ${{ vars.TWELVEDATA_API_KEY != '' || vars.TWELVEDATA != '' || vars.TWELVEDATA_KEY != '' || vars.TWELVE_API_KEY != '' || vars.TWELVE_DATA != '' || vars.TWELVE_DATA_API_KEY != '' || vars.TWELVE_DATA_KEY != '' || vars.TWELVE_KEY != '' || vars.TD_API_KEY != '' }}
          UW_SECRET: ${{ secrets.UNUSUAL_WHALES_API_KEY != '' || secrets.UNUSUAL_WHALES_TOKEN != '' || secrets.UW_API_KEY != '' }}
          UW_VAR: ${{ vars.UNUSUAL_WHALES_API_KEY != '' || vars.UNUSUAL_WHALES_TOKEN != '' || vars.UW_API_KEY != '' }}
          INTRINIO_SECRET: ${{ secrets.INTRINIO_API_KEY != '' || secrets.INTRINIO != '' || secrets.INTRINIO_API_TOKEN != '' || secrets.INTRINIO_KEY != '' || secrets.INTRINIO_TOKEN != '' }}
          INTRINIO_VAR: ${{ vars.INTRINIO_API_KEY != '' || vars.INTRINIO != '' || vars.INTRINIO_API_TOKEN != '' || vars.INTRINIO_KEY != '' || vars.INTRINIO_TOKEN != '' }}
          QUIVER_SECRET: ${{ secrets.QUIVER_API_KEY != '' || secrets.QUIVER != '' || secrets.QUIVERQUANT_API_KEY != '' || secrets.QUIVER_API_TOKEN != '' || secrets.QUIVER_KEY != '' || secrets.QUIVER_QUANT_API_KEY != '' || secrets.QUIVER_TOKEN != '' }}
          QUIVER_VAR: ${{ vars.QUIVER_API_KEY != '' || vars.QUIVER != '' || vars.QUIVERQUANT_API_KEY != '' || vars.QUIVER_API_TOKEN != '' || vars.QUIVER_KEY != '' || vars.QUIVER_QUANT_API_KEY != '' || vars.QUIVER_TOKEN != '' }}
          ALPACA_SECRET: ${{ secrets.ALPACA_API_KEY != '' || secrets.ALPACA_API_KEY_ID != '' || secrets.ALPACA_KEY != '' || secrets.ALPACA_KEY_ID != '' || secrets.ALPACA_PAPER_KEY != '' || secrets.APCA_API_KEY_ID != '' }}
          ALPACA_SECRET_SECRET: ${{ secrets.ALPACA_API_SECRET != '' || secrets.ALPACA_API_SECRET_KEY != '' || secrets.ALPACA_SECRET != '' || secrets.ALPACA_SECRET_KEY != '' || secrets.ALPACA_PAPER_SECRET != '' || secrets.APCA_API_SECRET_KEY != '' }}
          ALPACA_VAR: ${{ vars.ALPACA_API_KEY != '' || vars.ALPACA_API_KEY_ID != '' || vars.ALPACA_KEY != '' || vars.ALPACA_KEY_ID != '' || vars.ALPACA_PAPER_KEY != '' || vars.APCA_API_KEY_ID != '' }}
          ALPACA_SECRET_VAR: ${{ vars.ALPACA_API_SECRET != '' || vars.ALPACA_API_SECRET_KEY != '' || vars.ALPACA_SECRET != '' || vars.ALPACA_SECRET_KEY != '' || vars.ALPACA_PAPER_SECRET != '' || vars.APCA_API_SECRET_KEY != '' }}
          TICKSTREAM_SECRET: ${{ secrets.TICKSTREAM_API_KEY != '' || secrets.TICKSTREAM != '' || secrets.TICKSTREAM_KEY != '' || secrets.TICKSTREAM_TOKEN != '' || secrets.TICK_STREAM_API_KEY != '' }}
          TICKSTREAM_VAR: ${{ vars.TICKSTREAM_API_KEY != '' || vars.TICKSTREAM != '' || vars.TICKSTREAM_KEY != '' || vars.TICKSTREAM_TOKEN != '' || vars.TICK_STREAM_API_KEY != '' }}
          ARCHIVE_SECRET: ${{ secrets.ICARUS_DATA_ARCHIVE_KEY != '' }}
          ARCHIVE_VAR: ${{ vars.ICARUS_DATA_ARCHIVE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          env | grep -E '^(ALPHAVANTAGE|DATABENTO|EODHD|FINNHUB|FMP|FRED|MASSIVE|TIINGO|TWELVE|UW|INTRINIO|QUIVER|ALPACA|TICKSTREAM|ARCHIVE)_' | sort
