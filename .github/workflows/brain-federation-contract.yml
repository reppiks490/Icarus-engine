name: brain-federation-contract

on:
  push:
    branches: ["**"]
    paths:
      - "automation_intelligence/mcp_interface/contract.json"
      - "automation_intelligence/mcp_interface/icarus_consumer_contract.json"
      - "automation_intelligence/mcp_interface/events/**"
      - "tests/test_cross_repo_handoff.py"
      - "tests/test_mcp_federation_event_corpus.py"
      - ".github/workflows/brain-federation-contract.yml"
  pull_request:
    paths:
      - "automation_intelligence/mcp_interface/contract.json"
      - "automation_intelligence/mcp_interface/icarus_consumer_contract.json"
      - "automation_intelligence/mcp_interface/events/**"
      - "tests/test_cross_repo_handoff.py"
      - "tests/test_mcp_federation_event_corpus.py"
      - ".github/workflows/brain-federation-contract.yml"
  workflow_dispatch:

concurrency:
  group: brain-federation-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Validate bilateral Brain federation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run federation contract tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/test_cross_repo_handoff.py tests/test_mcp_federation_event_corpus.py -q
