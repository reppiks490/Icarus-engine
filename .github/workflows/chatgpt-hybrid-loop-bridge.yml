name: chatgpt-hybrid-loop-bridge

on:
  push:
    paths:
      - "automation_intelligence/hybrid_loop_fabric_v1/dispatch_trigger.json"
  schedule:
    - cron: "0 * * * *"
    - cron: "10 * * * *"
    - cron: "20 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      requested_lane:
        description: "Lane slug or all_active. Historical lanes must be dispatched one at a time."
        required: true
        type: string
        default: "all_active"
      reconcile_only:
        description: "Reconcile result/request health without creating a new request."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chatgpt-hybrid-loop-bridge-${{ github.event.schedule || inputs.requested_lane || github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh main
        shell: bash
        run: git pull --rebase origin main

      - name: Enqueue or reconcile durable hybrid work
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
          REQUESTED_LANE: ${{ inputs.requested_lane || 'all_active' }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --event-name "$EVENT_NAME"
            --schedule "$SCHEDULE_EXPR"
            --requested-lane "$REQUESTED_LANE"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          if [ "$RECONCILE_ONLY" = "true" ]; then
            args+=(--reconcile-only)
          fi
          python tools/hybrid_loop_bridge.py "${args[@]}"

      - name: Stage only hybrid runtime state
        shell: bash
        run: |
          set -euo pipefail
          git add automation_intelligence/hybrid_loop_fabric_v1/requests
          git add automation_intelligence/hybrid_loop_fabric_v1/health
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "No hybrid request/health state changed."
            exit 0
          fi
          invalid="$(printf '%s\n' "$staged" | grep -Ev '^automation_intelligence/hybrid_loop_fabric_v1/(requests|health)/' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing out-of-namespace hybrid mutation:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi

      - name: Commit and persist hybrid request state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "automation: hybrid loop request ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} [skip ci]"

          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; refusing unsafe automatic resolution." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to persist hybrid request state after 5 optimistic attempts." >&2
            exit 1
          fi
