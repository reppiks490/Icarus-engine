# CL (Claude, Anthropic) — 2026-10-04 — cl-federation-watch: report federation/automation health and alert via one issue
# Read-only monitor: it never repairs or relaxes a check. Writes automation_intelligence/cl_lab/federation_health.json
# only when the verdict or reasons change; opens/updates/closes the "[CL] Federation health" issue.
name: cl-federation-watch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows: ["interrepo-peer-intelligence", "brain-federation-contract", "tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: cl-federation-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assess federation health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m cl_lab.watch --issue
      - name: Commit verdict change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_intelligence/cl_lab/federation_health.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "verdict unchanged"; exit 0; fi
          git commit -m "[CL] federation health verdict change [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
