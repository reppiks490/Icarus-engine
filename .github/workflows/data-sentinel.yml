# S1 data-health sentinel (tools/data_sentinel.py): one verdict per data source, read from the receipts
# the collectors already commit plus the latest run of each workflow. Feeds the daily phone briefing.
name: data-sentinel

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_run:
    workflows: ["provider-exhaustive-collection", "cl-lab", "depth-vault"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "tools/data_sentinel.py"
      - ".github/workflows/data-sentinel.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: data-sentinel
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sentinel tests
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_data_sentinel.py -p no:cacheprovider -o addopts= --import-mode=importlib

      - name: Report and commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python -m tools.data_sentinel
            git add automation_intelligence/sentinel
            if git diff --cached --quiet; then echo "no change in data health"; exit 0; fi
            git commit -m "[sentinel] data health [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
