name: databento-depth-research-context

on:
  workflow_run:
    workflows: ["databento-depth-corpus", "cl-depth-sweep"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "tools/databento_depth_research_context.py"
      - "tests/test_databento_depth_research_context.py"
      - ".github/workflows/databento-depth-research-context.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: databento-depth-research-context
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependency
        run: python -m pip install "pytest>=8,<10" "cryptography>=44,<47"

      - name: Verify derived-depth bridge
        run: python -m pytest -q tests/test_databento_depth_research_context.py -p no:cacheprovider

      - name: Restore corpus-derived Databento depth cache
        uses: actions/cache/restore@v4
        with:
          path: .databento_depth_cache
          key: databento-depth-context-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            databento-depth-

      - name: Restore NQ sweep-derived Databento depth cache
        uses: actions/cache/restore@v4
        with:
          path: .databento_sweep_cache
          key: databento-sweep-context-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            databento-sweep-

      - name: Refill evicted depth cache from the encrypted vault
        # A cache miss is not data loss once a day is vaulted (tools/depth_vault.py).
        continue-on-error: true
        env:
          ICARUS_DATA_ARCHIVE_KEY: ${{ secrets.ICARUS_DATA_ARCHIVE_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          python -m pip install "cryptography>=44,<47"
          python -m tools.depth_vault restore --cache corpus=.databento_depth_cache --cache sweep=.databento_sweep_cache

      - name: Build research-only microstructure context
        run: >-
          python -m tools.databento_depth_research_context
          --repo-root .
          --depth-cache .databento_depth_cache
          --depth-cache .databento_sweep_cache

      - name: Refuse partial, empty or authority-bearing context
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('automation_intelligence/cl_lab/databento_depth_research_context.json')
          x = json.loads(p.read_text())
          assert x['schema_version'] == 'icarus-databento-depth-research-context-v1'
          assert x['authority'] == 'RESEARCH_CONTEXT_ONLY'
          assert x['raw_payloads_included'] is False
          assert x['raw_dbn_retained'] is False
          assert x['candidate_evidence_eligible'] is False
          assert x['execution_authorized'] is False
          assert x['production_decision_authorized'] is False
          assert x['automatic_model_promotion'] is False
          assert x['summary']['slices'] > 0
          assert x['summary']['feature_rows'] > 0
          for account in ('primary', 'secondary', 'third'):
              assert x['summary']['accounts'].get(account, 0) > 0, f'missing Databento {account} depth features'
          for lane in ('index', 'diversifier', 'sweep_primary', 'sweep_secondary', 'sweep_third'):
              assert lane in x['manifests'], f'missing Databento manifest {lane}'
          assert len(x['source_feature_caches']) == 2
          PY

      - name: Persist derived depth research context
        shell: bash
        run: |
          set -euo pipefail
          CONTEXT='automation_intelligence/cl_lab/databento_depth_research_context.json'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Derived state must be computed from the exact main snapshot that will
          # receive it. Never rebase a stale aggregate after another writer wins.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python -m tools.databento_depth_research_context \
              --repo-root . \
              --depth-cache .databento_depth_cache \
              --depth-cache .databento_sweep_cache
            git add -- "$CONTEXT"

            if git diff --cached --quiet; then
              echo "derived depth research context already current"
              exit 0
            fi

            staged="$(git diff --cached --name-only)"
            if [ "$staged" != "$CONTEXT" ]; then
              echo "Refusing out-of-scope Databento context mutation: $staged" >&2
              exit 1
            fi

            git commit -m "[Databento] publish derived depth research context retry-${attempt} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
