# Seals licensed derived depth caches and the preserved 13-market panel into the
# authenticated encrypted vault. Plaintext panel rows are never uploaded as artifacts.
name: depth-vault

on:
  workflow_run:
    workflows: ["databento-depth-corpus", "cl-depth-sweep"]
    types: [completed]
  schedule:
    - cron: "29 6 * * *"
  push:
    branches: [main, "claude/**", "atlas/**"]
    paths:
      - "tools/depth_vault.py"
      - "tools/asset_panel.py"
      - "tools/data_sentinel.py"
      - "tests/test_vendor_panel_vault.py"
      - "data/depth_vault/sources.json"
      - "config/credential_contract.json"
      - ".github/workflows/depth-vault.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: depth-vault-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # workflow_run and schedule always target main; a push seals onto its own branch.
      TARGET: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install "cryptography>=44,<47" "pytest>=8,<10" "numpy>=1.26,<3" "pandas>=2.2,<3"

      - name: Vault security and D1 tests
        run: |
          python -m pytest -q tests/test_depth_vault.py tests/test_vendor_panel_vault.py \
            -p no:cacheprovider -o addopts= --import-mode=importlib
          python -m pytest -q tests_cl/test_depth_test.py -p no:cacheprovider

      - name: Restore corpus depth cache
        uses: actions/cache/restore@v4
        with:
          path: .databento_depth_cache
          key: databento-depth-vault-${{ github.run_id }}
          restore-keys: |
            databento-depth-

      - name: Restore sweep depth cache
        uses: actions/cache/restore@v4
        with:
          path: .databento_sweep_cache
          key: databento-sweep-vault-${{ github.run_id }}
          restore-keys: |
            databento-sweep-

      - name: Seal, label, verify and privately restore-drill
        env:
          ICARUS_DATA_ARCHIVE_KEY: ${{ secrets.ICARUS_DATA_ARCHIVE_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY || secrets.DATABENTO_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET"
            git reset --hard "origin/$TARGET"

            # Existing depth caches retain their current vault semantics.
            python -m tools.depth_vault seal \
              --cache corpus=.databento_depth_cache \
              --cache sweep=.databento_sweep_cache

            # L1: plaintext panel CSVs are selected explicitly; default vault suffixes remain unchanged.
            python -m tools.depth_vault seal --cache panel=data/panel --suffix .csv

            # J02: labels are deterministic. Verify decrypts/authenticates in memory and writes only a receipt.
            python -m tools.depth_vault label
            python -m tools.depth_vault verify --out automation_intelligence/sentinel/vault_verify.json

            # Private recovery proof. Restored plaintext lives only under runner temp and is never added/artifacted.
            PANEL_DRILL="$RUNNER_TEMP/icarus-panel-restore-$GITHUB_RUN_ID"
            rm -rf "$PANEL_DRILL"
            PANEL_DRILL="$PANEL_DRILL" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.asset_panel import ensure_panel

          target = Path(os.environ["PANEL_DRILL"])
          ensure_panel(target)
          files = sorted(target.glob("*_5m.csv"))
          manifest = json.loads(Path("data/depth_vault/manifest.json").read_text())
          expected = manifest.get("caches", {}).get("panel", {})
          assert len(expected) == 13, f"expected 13 vaulted panel files, got {len(expected)}"
          assert len(files) == 13, f"private restore drill produced {len(files)} files"
          print("panel restore drill ok: 13 authenticated files")
          PY
            rm -rf "$PANEL_DRILL"

            # Existing preregistered D1 lane: aggregate statistics only, no vendor rows.
            python -m cl_lab.depth_test --cache .databento_sweep_cache \
              --out automation_intelligence/cl_lab/depth_d1_latest.json

            git add data/depth_vault \
              automation_intelligence/cl_lab/depth_d1_latest.json \
              automation_intelligence/sentinel/vault_verify.json
            if git diff --cached --quiet; then echo "vault already current"; exit 0; fi
            git commit -m "[vault] seal label verify and restore-drill [skip ci]"
            if git push origin "HEAD:$TARGET"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
