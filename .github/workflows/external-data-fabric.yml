# ChatGPT — 2026-10-04 — EODHD + FMP + Tiingo strategic collection
name: external-data-fabric

on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cl_lab/feeds/external_data_fabric.py"
      - "tests_cl/test_external_data_fabric.py"
      - ".github/workflows/external-data-fabric.yml"

permissions:
  contents: write

concurrency:
  group: external-data-fabric
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" pytest

      - name: External-fabric tests
        run: python -m pytest -q tests_cl/test_external_data_fabric.py -p no:cacheprovider

      - name: Restore provider cache
        uses: actions/cache/restore@v4
        with:
          path: .external_data_cache
          key: external-data-${{ github.run_id }}
          restore-keys: |
            external-data-

      - name: Collect strategic external data
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: >-
          python -m cl_lab.feeds.external_data_fabric
          --cache .external_data_cache
          --out automation_intelligence/cl_lab/external_data_fabric.json

      - name: Save provider cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .external_data_cache
          key: external-data-${{ github.run_id }}

      - name: Commit compact manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation_intelligence/cl_lab/external_data_fabric.json
          if git diff --cached --quiet; then echo "no external-data manifest changes"; exit 0; fi
          git commit -m "[Data] EODHD FMP Tiingo external fabric [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
