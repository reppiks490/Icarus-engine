name: external-provider-contracts

on:
  push:
    branches:
      - chatgpt/external-data-fabric-20261006
    paths:
      - "cl_lab/data_fabric/**"
      - "cl_lab/providers/**"
      - "tools/collect_external_provider_data.py"
      - "tests_cl/test_data_fabric_contracts.py"
      - "tests_cl/test_intrinio_provider.py"
      - "tests_cl/test_unusual_whales_provider.py"
      - "tests_cl/test_external_provider_orchestrator.py"
      - "tests_cl/test_external_provider_acquisition.py"
      - "tests_cl/test_external_provider_backfill.py"
      - "tests_cl/test_external_provider_streaming.py"
      - ".github/workflows/external-provider-contracts.yml"
  pull_request:
    paths:
      - "cl_lab/data_fabric/**"
      - "cl_lab/providers/**"
      - "tools/collect_external_provider_data.py"
      - "tests_cl/test_data_fabric_contracts.py"
      - "tests_cl/test_intrinio_provider.py"
      - "tests_cl/test_unusual_whales_provider.py"
      - "tests_cl/test_external_provider_orchestrator.py"
      - "tests_cl/test_external_provider_acquisition.py"
      - "tests_cl/test_external_provider_backfill.py"
      - "tests_cl/test_external_provider_streaming.py"
      - ".github/workflows/external-provider-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-provider-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run external-provider contract tests
        run: >-
          python -m pytest -q
          tests_cl/test_data_fabric_contracts.py
          tests_cl/test_intrinio_provider.py
          tests_cl/test_unusual_whales_provider.py
          tests_cl/test_external_provider_orchestrator.py
          tests_cl/test_external_provider_acquisition.py
          tests_cl/test_external_provider_backfill.py
          tests_cl/test_external_provider_streaming.py
          -p no:cacheprovider
