name: FR-1 synthetic contract

on:
  push:
    paths:
      - 'cl_lab/**'
      - 'tests_cl/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/fr1-synthetic-contract.yml'
  pull_request:
    paths:
      - 'cl_lab/**'
      - 'tests_cl/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/fr1-synthetic-contract.yml'

permissions:
  contents: read

concurrency:
  group: fr1-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            cl_lab
            tests_cl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.11' 'pytest>=8,<10'
      - name: Verify synthetic contracts without empirical data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test ! -d data
          test ! -d automation_intelligence
          python -m pytest tests_cl/test_frontier.py tests_cl/test_trial_ledger.py -q -o addopts='' -p no:cacheprovider
