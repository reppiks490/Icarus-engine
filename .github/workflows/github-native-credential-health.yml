          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY || vars.TWELVE_API_KEY }}
          TWELVE_DATA: ${{ secrets.TWELVE_DATA || vars.TWELVE_DATA }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY || vars.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY || vars.TWELVE_DATA_KEY }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY || vars.TWELVE_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY || vars.TD_API_KEY }}
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY || vars.UNUSUAL_WHALES_API_KEY }}
          UNUSUAL_WHALES_TOKEN: ${{ secrets.UNUSUAL_WHALES_TOKEN || vars.UNUSUAL_WHALES_TOKEN }}
          UW_API_KEY: ${{ secrets.UW_API_KEY || vars.UW_API_KEY }}
        run: |
          set -euo pipefail
          python -m tools.credential_health --json-lines | tee credential-health.jsonl
      - name: Publish redacted credential health
        uses: actions/upload-artifact@v4
        with:
          name: github-native-credential-health-${{ github.run_id }}
          path: credential-health.jsonl
          retention-days: 14
          if-no-files-found: error
