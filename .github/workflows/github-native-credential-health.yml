name: github-native-credential-health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/credential_contract.json'
      - 'icarus_engine/security/**'
      - 'tools/credential_health.py'
      - 'tools/provider_credentials.py'
      - 'docs/agent-handoffs/GITHUB_NATIVE_CREDENTIALS.md'
      - '.github/workflows/github-native-credential-health.yml'

permissions:
  contents: read

jobs:
  redacted-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify credential contract tests
        run: python -m pip install 'pytest>=8,<10' && python -m pytest tests/test_github_native_credentials.py -q
      - name: Report GitHub-native credential availability
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || vars.ALPACA_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID || vars.ALPACA_API_KEY_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY || vars.ALPACA_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID || vars.ALPACA_KEY_ID }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY || vars.ALPACA_PAPER_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || vars.APCA_API_KEY_ID }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET || vars.ALPACA_API_SECRET }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY || vars.ALPACA_API_SECRET_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET || vars.ALPACA_SECRET }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || vars.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET || vars.ALPACA_PAPER_SECRET }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || vars.APCA_API_SECRET_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY || vars.ALPHAVANTAGE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY || vars.ALPHA_VANTAGE_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY || vars.ALPHA_VANTAGE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY || vars.BENZINGA_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY || vars.BINANCE_API_KEY }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY || vars.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET || vars.BYBIT_API_SECRET }}
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY || vars.COINBASE_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY || vars.COINGLASS_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY || vars.DATABENTO_API_KEY }}
          DATABENTO_KEY: ${{ secrets.DATABENTO_KEY || vars.DATABENTO_KEY }}
          DATABENTO_API_KEY_SECONDARY: ${{ secrets.DATABENTO_API_KEY_SECONDARY || vars.DATABENTO_API_KEY_SECONDARY }}
