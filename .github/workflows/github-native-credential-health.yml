          EOD_API_KEY: ${{ secrets.EOD_API_KEY || vars.EOD_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || vars.FINNHUB_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || vars.FINNHUB_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || vars.FMP_API_KEY }}
