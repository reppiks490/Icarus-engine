          QUIVER_KEY: ${{ secrets.QUIVER_KEY || vars.QUIVER_KEY }}
          QUIVER_QUANT_API_KEY: ${{ secrets.QUIVER_QUANT_API_KEY || vars.QUIVER_QUANT_API_KEY }}
          QUIVER_TOKEN: ${{ secrets.QUIVER_TOKEN || vars.QUIVER_TOKEN }}
          RITHMIC_USER: ${{ secrets.RITHMIC_USER || vars.RITHMIC_USER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
          TICKSTREAM_API_KEY: ${{ secrets.TICKSTREAM_API_KEY || vars.TICKSTREAM_API_KEY }}
          TICKSTREAM: ${{ secrets.TICKSTREAM || vars.TICKSTREAM }}
          TICKSTREAM_KEY: ${{ secrets.TICKSTREAM_KEY || vars.TICKSTREAM_KEY }}
          TICKSTREAM_TOKEN: ${{ secrets.TICKSTREAM_TOKEN || vars.TICKSTREAM_TOKEN }}
          TICK_STREAM_API_KEY: ${{ secrets.TICK_STREAM_API_KEY || vars.TICK_STREAM_API_KEY }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN || vars.TIINGO_API_TOKEN }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY || vars.TIINGO_API_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO_KEY || vars.TIINGO_KEY }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN || vars.TIINGO_TOKEN }}
          TOPSTEP_API_KEY: ${{ secrets.TOPSTEP_API_KEY || vars.TOPSTEP_API_KEY }}
          TRADESTATION_API_KEY: ${{ secrets.TRADESTATION_API_KEY || vars.TRADESTATION_API_KEY }}
          TRADINGVIEW_USERNAME: ${{ secrets.TRADINGVIEW_USERNAME || vars.TRADINGVIEW_USERNAME }}
          TRADINGVIEW_PASSWORD: ${{ secrets.TRADINGVIEW_PASSWORD || vars.TRADINGVIEW_PASSWORD }}
          TRADINGVIEW_SESSIONID: ${{ secrets.TRADINGVIEW_SESSIONID || vars.TRADINGVIEW_SESSIONID }}
          TV_SESSIONID: ${{ secrets.TV_SESSIONID || vars.TV_SESSIONID }}
          TRADOVATE_API_KEY: ${{ secrets.TRADOVATE_API_KEY || vars.TRADOVATE_API_KEY }}
          TRADOVATE_CID: ${{ secrets.TRADOVATE_CID || vars.TRADOVATE_CID }}
          TRADOVATE_PASSWORD: ${{ secrets.TRADOVATE_PASSWORD || vars.TRADOVATE_PASSWORD }}
