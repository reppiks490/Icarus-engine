          INTRINIO_API_KEY: ${{ secrets.INTRINIO_API_KEY || vars.INTRINIO_API_KEY }}
          INTRINIO: ${{ secrets.INTRINIO || vars.INTRINIO }}
          INTRINIO_API_TOKEN: ${{ secrets.INTRINIO_API_TOKEN || vars.INTRINIO_API_TOKEN }}
          INTRINIO_KEY: ${{ secrets.INTRINIO_KEY || vars.INTRINIO_KEY }}
          INTRINIO_TOKEN: ${{ secrets.INTRINIO_TOKEN || vars.INTRINIO_TOKEN }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY || vars.KRAKEN_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || vars.MASSIVE_API_KEY }}
          MASSIVE: ${{ secrets.MASSIVE || vars.MASSIVE }}
          MASSIVE_API_TOKEN: ${{ secrets.MASSIVE_API_TOKEN || vars.MASSIVE_API_TOKEN }}
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY || vars.MASSIVE_KEY }}
          MASSIVE_TOKEN: ${{ secrets.MASSIVE_TOKEN || vars.MASSIVE_TOKEN }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || vars.POLYGON_API_KEY }}
          POLYGON_IO_API_KEY: ${{ secrets.POLYGON_IO_API_KEY || vars.POLYGON_IO_API_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY || vars.POLYGON_KEY }}
