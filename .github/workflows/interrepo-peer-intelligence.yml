name: interrepo-peer-intelligence

on:
  push:
    branches: [main]
    paths:
      - "automation_intelligence/restored_five_native/control_plane.json"
      - "automation_intelligence/agent_fabric/**/heartbeat.json"
      - "automation_intelligence/agent_fabric/**/finalization_state.json"
      - "automation_intelligence/flow/heartbeat.json"
      - "automation_intelligence/flow/finalization_state.json"
      - "automation_intelligence/mcp_interface/contract.json"
      - "automation_intelligence/mcp_interface/icarus_consumer_contract.json"
      - "icarus_engine/interrepo_bridge.py"
      - "tools/export_peer_intelligence.py"
      - ".github/workflows/interrepo-peer-intelligence.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interrepo-peer-intelligence
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install peer-export test dependency
        run: python -m pip install pytest

      - name: Refresh main before verification and packet export
        run: git pull --rebase origin main

      - name: Verify peer packet implementation
        run: python -m pytest tests_engine/test_interrepo_bridge.py -q

      - name: Export revision-bound peer packet
        run: PYTHONPATH=. python tools/export_peer_intelligence.py --root . --require-head-match

      - name: Stage only the peer packet
        shell: bash
        run: |
          set -euo pipefail
          git add automation_intelligence/interrepo/latest.json
          if git diff --cached --quiet; then
            echo "PEER_PACKET_NO_CHANGE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "automation_intelligence/interrepo/latest.json" ]; then
            echo "Refusing out-of-scope peer packet mutation:" >&2
            printf '%s\n' "$staged" >&2
            exit 1
          fi
          echo "PEER_PACKET_NO_CHANGE=0" >> "$GITHUB_ENV"

      - name: Commit peer packet
        if: env.PEER_PACKET_NO_CHANGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "federation: refresh Icarus peer intelligence [skip ci]"

          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Peer-packet rebase conflict; refusing unsafe automatic resolution." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to persist peer packet after 5 optimistic push attempts." >&2
            exit 1
          fi
