name: provider-exhaustive-collection

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/provider_exhaustive_collection.py'
      - 'config/provider_endpoint_catalog.json'
      - 'tests/test_provider_exhaustive_collection.py'
      - '.github/workflows/provider-exhaustive-collection.yml'

permissions:
  contents: write

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        provider: [massive, twelve, fmp, eodhd, tiingo, intrinio, quiver, fred, alpaca, bybit, tickstream]
    concurrency:
      group: provider-exhaustive-${{ matrix.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded acquisition dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Verify pagination, credential and scope boundaries
        run: python -m pytest tests/test_provider_exhaustive_collection.py -q
      - name: Restore resumable provider catalog state
        uses: actions/cache/restore@v4
        with:
          path: .provider_collection_cache
          key: provider-coverage-v1-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: provider-coverage-v1-${{ matrix.provider }}-
      - name: Drain all-catalog provider queue without ChatGPT
        env:
          # Every canonical provider variable accepts the same value from either
          # a GitHub Actions secret or repository/environment variable. Common
          # historical aliases are folded into the canonical names so the
          # collector does not silently miss an otherwise configured credential.
          TICKSTREAM_API_KEY: ${{ secrets.TICKSTREAM_API_KEY || vars.TICKSTREAM_API_KEY || secrets.TICK_STREAM_API_KEY || vars.TICK_STREAM_API_KEY }}
          TICK_STREAM_API_KEY: ${{ secrets.TICK_STREAM_API_KEY || vars.TICK_STREAM_API_KEY || secrets.TICKSTREAM_API_KEY || vars.TICKSTREAM_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || vars.MASSIVE_API_KEY || secrets.POLYGON_API_KEY || vars.POLYGON_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || vars.POLYGON_API_KEY || secrets.MASSIVE_API_KEY || vars.MASSIVE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY || vars.TWELVE_DATA_API_KEY || secrets.TWELVEDATA_API_KEY || vars.TWELVEDATA_API_KEY || secrets.TWELVE_API_KEY || vars.TWELVE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || vars.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY || vars.TWELVE_DATA_API_KEY || secrets.TWELVE_API_KEY || vars.TWELVE_API_KEY }}
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY || vars.TWELVE_API_KEY || secrets.TWELVE_DATA_API_KEY || vars.TWELVE_DATA_API_KEY || secrets.TWELVEDATA_API_KEY || vars.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || vars.FMP_API_KEY }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN || vars.EODHD_API_TOKEN || secrets.EODHD_API_KEY || vars.EODHD_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || vars.EODHD_API_KEY || secrets.EODHD_API_TOKEN || vars.EODHD_API_TOKEN }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN || vars.TIINGO_API_TOKEN || secrets.TIINGO_API_KEY || vars.TIINGO_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY || vars.TIINGO_API_KEY || secrets.TIINGO_API_TOKEN || vars.TIINGO_API_TOKEN }}
          INTRINIO_API_KEY: ${{ secrets.INTRINIO_API_KEY || vars.INTRINIO_API_KEY || secrets.INTRINIO_API_TOKEN || vars.INTRINIO_API_TOKEN }}
          INTRINIO_API_TOKEN: ${{ secrets.INTRINIO_API_TOKEN || vars.INTRINIO_API_TOKEN || secrets.INTRINIO_API_KEY || vars.INTRINIO_API_KEY }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY || vars.QUIVER_API_KEY || secrets.QUIVER_API_TOKEN || vars.QUIVER_API_TOKEN || secrets.QUIVER_QUANT_API_KEY || vars.QUIVER_QUANT_API_KEY }}
          QUIVER_API_TOKEN: ${{ secrets.QUIVER_API_TOKEN || vars.QUIVER_API_TOKEN || secrets.QUIVER_API_KEY || vars.QUIVER_API_KEY || secrets.QUIVER_QUANT_API_KEY || vars.QUIVER_QUANT_API_KEY }}
          QUIVER_QUANT_API_KEY: ${{ secrets.QUIVER_QUANT_API_KEY || vars.QUIVER_QUANT_API_KEY || secrets.QUIVER_API_KEY || vars.QUIVER_API_KEY || secrets.QUIVER_API_TOKEN || vars.QUIVER_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || vars.ALPACA_API_KEY || secrets.APCA_API_KEY_ID || vars.APCA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || vars.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY || vars.APCA_API_SECRET_KEY }}
          ICARUS_DATA_ARCHIVE_KEY: ${{ secrets.ICARUS_DATA_ARCHIVE_KEY }}
        run: >-
          python -m tools.provider_exhaustive_collection
          --provider '${{ matrix.provider }}'
          --run-id 'providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}'
          --request-budget 20 --delay-seconds 13
      - name: Save provider cursor progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .provider_collection_cache
          key: provider-coverage-v1-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve derived receipts and encrypted payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            automation_intelligence/provider_collection_v1/cycles/providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}/
            .provider_collection_archives/providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
      - name: Persist only provider-owned status and MCP evidence
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER='${{ matrix.provider }}'
          RUN='providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}'
          git add "automation_intelligence/provider_collection_v1/cycles/$RUN"
          git add "automation_intelligence/provider_collection_v1/latest/$PROVIDER.json"
          git add "automation_intelligence/mcp_interface/events/provider-coverage-$RUN.json"
          invalid="$(git diff --cached --name-only | grep -Ev "^(automation_intelligence/provider_collection_v1/(cycles/$RUN/|latest/$PROVIDER\.json$|checkpoints/$PROVIDER\.enc$)|automation_intelligence/mcp_interface/events/provider-coverage-$RUN\.json$)" || true)"
          if [ -n "$invalid" ]; then echo 'Out-of-scope paths staged'; exit 1; fi
          if [ -f "automation_intelligence/provider_collection_v1/checkpoints/$PROVIDER.enc" ]; then
            git add "automation_intelligence/provider_collection_v1/checkpoints/$PROVIDER.enc"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: provider $PROVIDER $RUN [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
