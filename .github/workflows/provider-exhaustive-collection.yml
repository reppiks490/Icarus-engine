name: provider-exhaustive-collection

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/provider_exhaustive_collection.py'
      - 'tools/provider_credentials.py'
      - 'tools/provider_research_context.py'
      - 'config/provider_endpoint_catalog.json'
      - 'config/credential_contract.json'
      - 'tests/test_provider_exhaustive_collection.py'
      - 'tests/test_provider_research_context.py'
      - 'tests/test_github_native_credentials.py'
      - '.github/workflows/provider-exhaustive-collection.yml'

permissions:
  contents: write

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        provider: [massive, twelve, fmp, eodhd, tiingo, intrinio, quiver, fred, alpaca, bybit, tickstream]
    concurrency:
      group: provider-exhaustive-${{ matrix.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded acquisition dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Verify pagination, credential and scope boundaries
        run: python -m pytest tests/test_provider_exhaustive_collection.py tests/test_provider_research_context.py tests/test_github_native_credentials.py -q
      - name: Restore resumable provider catalog state
        uses: actions/cache/restore@v4
        with:
          path: .provider_collection_cache
          key: provider-coverage-v1-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: provider-coverage-v1-${{ matrix.provider }}-
      - name: Drain all-catalog provider queue without ChatGPT
        env:
          TICKSTREAM_API_KEY: ${{ secrets.TICKSTREAM_API_KEY || secrets.TICKSTREAM || secrets.TICKSTREAM_KEY || secrets.TICKSTREAM_TOKEN || secrets.TICK_STREAM_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE || secrets.MASSIVE_API_TOKEN || secrets.MASSIVE_KEY || secrets.MASSIVE_TOKEN || secrets.POLYGON_API_KEY || secrets.POLYGON_IO_API_KEY || secrets.POLYGON_KEY || secrets.POLYGON_TOKEN || secrets.POLYGON }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVEDATA || secrets.TWELVEDATA_KEY || secrets.TWELVE_API_KEY || secrets.TWELVE_DATA || secrets.TWELVE_DATA_API_KEY || secrets.TWELVE_DATA_KEY || secrets.TWELVE_KEY || secrets.TD_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || secrets.FMP_KEY }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY || secrets.EODHD_KEY || secrets.EOD_API_KEY }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN || secrets.TIINGO_API_KEY || secrets.TIINGO_KEY || secrets.TIINGO_TOKEN }}
          INTRINIO_API_KEY: ${{ secrets.INTRINIO_API_KEY || secrets.INTRINIO || secrets.INTRINIO_API_TOKEN || secrets.INTRINIO_KEY || secrets.INTRINIO_TOKEN }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY || secrets.QUIVER || secrets.QUIVERQUANT_API_KEY || secrets.QUIVER_API_TOKEN || secrets.QUIVER_KEY || secrets.QUIVER_QUANT_API_KEY || secrets.QUIVER_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.ALPACA_API_KEY_ID || secrets.ALPACA_KEY || secrets.ALPACA_KEY_ID || secrets.ALPACA_PAPER_KEY || secrets.APCA_API_KEY_ID }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET || secrets.ALPACA_API_SECRET_KEY || secrets.ALPACA_SECRET || secrets.ALPACA_SECRET_KEY || secrets.ALPACA_PAPER_SECRET || secrets.APCA_API_SECRET_KEY }}
          ICARUS_DATA_ARCHIVE_KEY: ${{ secrets.ICARUS_DATA_ARCHIVE_KEY }}
        run: >-
          python -m tools.provider_credentials --provider '${{ matrix.provider }}' --
          python -m tools.provider_exhaustive_collection
          --provider '${{ matrix.provider }}'
          --run-id 'providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}'
          --request-budget 20 --delay-seconds 13
      - name: Save provider cursor progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .provider_collection_cache
          key: provider-coverage-v1-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve derived receipts and encrypted payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            automation_intelligence/provider_collection_v1/cycles/providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}/
            .provider_collection_archives/providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
      - name: Persist only provider-owned status and MCP evidence
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER='${{ matrix.provider }}'
          RUN='providers-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.provider }}'
          git add "automation_intelligence/provider_collection_v1/cycles/$RUN"
          git add "automation_intelligence/provider_collection_v1/latest/$PROVIDER.json"
          git add "automation_intelligence/mcp_interface/events/provider-coverage-$RUN.json"
          invalid="$(git diff --cached --name-only | grep -Ev "^(automation_intelligence/provider_collection_v1/(cycles/$RUN/|latest/$PROVIDER\.json$|checkpoints/$PROVIDER\.enc$)|automation_intelligence/mcp_interface/events/provider-coverage-$RUN\.json$)" || true)"
          if [ -n "$invalid" ]; then echo 'Out-of-scope paths staged'; exit 1; fi
          if [ -f "automation_intelligence/provider_collection_v1/checkpoints/$PROVIDER.enc" ]; then
            git add "automation_intelligence/provider_collection_v1/checkpoints/$PROVIDER.enc"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: provider $PROVIDER $RUN [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  aggregate-research-context:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: provider-research-context
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregation test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify provider context aggregation contract
        run: python -m pytest tests/test_provider_research_context.py -q
      - name: Rebuild provider research context from committed latest receipts
        shell: bash
        run: python -m tools.provider_research_context --repo-root .
      - name: Persist research context from a fresh snapshot
        shell: bash
        run: |
          set -euo pipefail
          PATH_TO_CONTEXT='automation_intelligence/provider_collection_v1/research_context.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$PATH_TO_CONTEXT"
          if git diff --cached --quiet; then
            echo 'Provider research context already current.'
            exit 0
          fi
          git commit -m "research: aggregate provider context [skip ci]"
          if git push origin HEAD:main; then
            exit 0
          fi

          # A failed push means main changed. Never rebase a derived aggregate
          # computed from stale provider receipts; refresh, recompute, and retry.
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python -m tools.provider_research_context --repo-root .
            git add -- "$PATH_TO_CONTEXT"
            if git diff --cached --quiet; then
              echo 'Concurrent writer already converged provider context.'
              exit 0
            fi
            staged="$(git diff --cached --name-only)"
            if [ "$staged" != "$PATH_TO_CONTEXT" ]; then
              echo "Refusing out-of-scope provider context mutation: $staged" >&2
              exit 1
            fi
            git commit -m "research: aggregate provider context retry-${attempt} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
