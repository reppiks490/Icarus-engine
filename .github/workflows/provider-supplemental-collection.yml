name: provider-supplemental-collection

on:
  workflow_dispatch:
  push:
    branches: [atlas/ingestion-surface-closure]
    paths:
      - 'tools/provider_supplemental_collection.py'
      - 'config/provider_endpoint_catalog_supplemental.json'
      - 'config/data_ingestion_manifest.json'
      - 'tests/test_ingestion_surface_contract.py'
      - '.github/workflows/provider-supplemental-collection.yml'
  pull_request:
    paths:
      - 'tools/provider_supplemental_collection.py'
      - 'config/provider_endpoint_catalog_supplemental.json'
      - 'config/data_ingestion_manifest.json'
      - 'tests/test_ingestion_surface_contract.py'
      - '.github/workflows/provider-supplemental-collection.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - run: python -m pytest tests/test_ingestion_surface_contract.py tests/test_provider_exhaustive_collection.py tests/test_provider_research_context.py tests/test_github_native_credentials.py -q

  collect:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        provider: [unusual_whales, alphavantage, finnhub]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=44,<47'
      - name: Collect provider evidence
        env:
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY || secrets.UNUSUAL_WHALES_TOKEN || secrets.UW_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB_KEY }}
        run: >-
          python -m tools.provider_credentials --provider '${{ matrix.provider }}' --
          python -m tools.provider_supplemental_collection
          --provider '${{ matrix.provider }}'
          --run-id 'supplemental-${{ github.run_id }}-${{ matrix.provider }}'
          --request-budget 5 --delay-seconds 13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplemental-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            automation_intelligence/provider_collection_v1/cycles/
            automation_intelligence/provider_collection_v1/latest/
            automation_intelligence/mcp_interface/events/
            .provider_collection_archives/
          include-hidden-files: true
          retention-days: 7
