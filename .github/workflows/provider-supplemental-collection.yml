name: provider-supplemental-collection

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/provider_supplemental_collection.py'
      - 'tools/provider_supplemental_transport.py'
      - 'tools/provider_credentials.py'
      - 'tools/provider_research_context.py'
      - 'tools/native_provider_access.py'
      - 'config/provider_endpoint_catalog_supplemental.json'
      - 'config/data_ingestion_manifest.json'
      - 'config/federated_repo_evidence.json'
      - 'config/credential_contract.json'
      - 'docs/agent-handoffs/CROSS_REPO_EVIDENCE.md'
      - 'tests/test_ingestion_surface_contract.py'
      - 'tests/test_provider_supplemental_transport.py'
      - 'tests/test_supplemental_resilience.py'
      - 'tests/test_federated_data_surface.py'
      - 'tests/test_crossrepo_evidence_federation.py'
      - 'tests/test_native_provider_access.py'
      - '.github/workflows/provider-supplemental-collection.yml'
  pull_request:
    paths:
      - 'tools/provider_supplemental_collection.py'
      - 'tools/provider_supplemental_transport.py'
      - 'tools/native_provider_access.py'
      - 'config/provider_endpoint_catalog_supplemental.json'
      - 'config/data_ingestion_manifest.json'
      - 'config/federated_repo_evidence.json'
      - 'docs/agent-handoffs/CROSS_REPO_EVIDENCE.md'
      - 'tests/test_ingestion_surface_contract.py'
      - 'tests/test_provider_supplemental_transport.py'
      - 'tests/test_supplemental_resilience.py'
      - 'tests/test_federated_data_surface.py'
      - 'tests/test_crossrepo_evidence_federation.py'
      - 'tests/test_native_provider_access.py'
      - '.github/workflows/provider-supplemental-collection.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - run: >-
          python -m pytest
          tests/test_ingestion_surface_contract.py
          tests/test_provider_supplemental_transport.py
          tests/test_supplemental_resilience.py
          tests/test_federated_data_surface.py
          tests/test_crossrepo_evidence_federation.py
          tests/test_native_provider_access.py
          tests/test_provider_exhaustive_collection.py
          tests/test_provider_research_context.py
          tests/test_github_native_credentials.py -q

  collect:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        provider: [unusual_whales, alphavantage, finnhub]
    concurrency:
      group: provider-supplemental-${{ matrix.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=44,<47'
      - name: Restore resumable supplemental provider state
        uses: actions/cache/restore@v4
        with:
          path: .provider_collection_cache
          key: provider-supplemental-v1-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: provider-supplemental-v1-${{ matrix.provider }}-
      - name: Collect provider evidence
        env:
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY || secrets.UNUSUAL_WHALES_TOKEN || secrets.UW_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB_KEY }}
        run: >-
          python -m tools.provider_credentials --provider '${{ matrix.provider }}' --
          python -m tools.provider_supplemental_transport
          --provider '${{ matrix.provider }}'
          --run-id 'supplemental-${{ github.run_id }}-${{ matrix.provider }}'
          --request-budget 5 --delay-seconds 13
      - name: Save resumable supplemental provider state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .provider_collection_cache
          key: provider-supplemental-v1-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplemental-${{ matrix.provider }}-${{ github.run_id }}
          path: |
            automation_intelligence/provider_collection_v1/cycles/supplemental-${{ github.run_id }}-${{ matrix.provider }}/
            automation_intelligence/provider_collection_v1/latest/${{ matrix.provider }}.json
            automation_intelligence/provider_collection_v1/checkpoints/${{ matrix.provider }}.enc
            automation_intelligence/mcp_interface/events/provider-coverage-supplemental-${{ github.run_id }}-${{ matrix.provider }}.json
            .provider_collection_archives/supplemental-${{ github.run_id }}-${{ matrix.provider }}/
          include-hidden-files: true
          retention-days: 7
