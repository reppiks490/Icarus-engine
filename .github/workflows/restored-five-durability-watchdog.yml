name: restored-five-durability-watchdog

on:
  push:
    branches: [main]
    paths:
      - "tools/restored_five_durability_watchdog.py"
      - ".github/workflows/restored-five-durability-watchdog.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restored-five-durability-watchdog
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconcile restored ICARUS lanes
        run: >-
          python tools/restored_five_durability_watchdog.py
          --repo-root .
          --stale-minutes 30
          --lane "robustness_guardian|automation_intelligence/agent_fabric/robustness_guardian|6abaf924e0248191b8a11bd1d32bf0b7"
          --lane "alpha_synthesis|automation_intelligence/agent_fabric/alpha_synthesis|6abaf8d75cf48191bc7ce06bc0006f1c"
          --lane "flow_microstructure|automation_intelligence/flow|6abaef8effb48191aa5c959455451681"
          --lane "apex_council|automation_intelligence/agent_fabric/apex_council|6ababd570fac81918777c8f809cf67c9"

      - name: Stage only restored-lane runtime state
        shell: bash
        run: |
          set -euo pipefail
          git add             automation_intelligence/agent_fabric/robustness_guardian/startup_state.json             automation_intelligence/agent_fabric/robustness_guardian/heartbeat.json             automation_intelligence/agent_fabric/alpha_synthesis/startup_state.json             automation_intelligence/agent_fabric/alpha_synthesis/heartbeat.json             automation_intelligence/flow/startup_state.json             automation_intelligence/flow/heartbeat.json             automation_intelligence/agent_fabric/apex_council/startup_state.json             automation_intelligence/agent_fabric/apex_council/heartbeat.json

          if git diff --cached --quiet; then
            echo "WATCHDOG_NO_CHANGE=1" >> "$GITHUB_ENV"
            exit 0
          fi

          staged="$(git diff --cached --name-only)"
          invalid="$(printf '%s\n' "$staged" | grep -Ev '^(automation_intelligence/agent_fabric/(robustness_guardian|alpha_synthesis|apex_council)/(startup_state|heartbeat)\.json|automation_intelligence/flow/(startup_state|heartbeat)\.json)$' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing out-of-scope watchdog mutation:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi
          echo "WATCHDOG_NO_CHANGE=0" >> "$GITHUB_ENV"

      - name: Commit verified recovery state
        if: env.WATCHDOG_NO_CHANGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "automation: restored-five durability recovery $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"
          git push origin HEAD:main
