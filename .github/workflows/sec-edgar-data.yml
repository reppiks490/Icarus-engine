name: sec-edgar-data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cl_lab/feeds/sec_edgar.py"
      - "tests_cl/test_sec_edgar.py"
      - "tests_cl/test_sec_edgar_context.py"
      - ".github/workflows/sec-edgar-data.yml"

permissions:
  contents: write

concurrency:
  group: sec-edgar-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" pytest

      - name: SEC EDGAR fixture and research-context tests
        run: python -m pytest -q tests_cl/test_sec_edgar.py tests_cl/test_sec_edgar_context.py -p no:cacheprovider

      - name: Restore SEC EDGAR cache
        uses: actions/cache/restore@v4
        with:
          path: .sec_edgar_cache
          key: sec-edgar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sec-edgar-

      - name: Refresh SEC EDGAR filings and XBRL
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
          ICARUS_SEC_CACHE: .sec_edgar_cache
          ICARUS_SEC_MANIFEST: automation_intelligence/cl_lab/sec_edgar_manifest.json
          ICARUS_SEC_CONTEXT: automation_intelligence/cl_lab/sec_edgar_research_context.json
          ICARUS_SEC_TICKERS: ${{ vars.ICARUS_SEC_TICKERS }}
        run: python -m cl_lab.feeds.sec_edgar

      - name: Save SEC EDGAR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sec_edgar_cache
          key: sec-edgar-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit SEC EDGAR manifest and research context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            automation_intelligence/cl_lab/sec_edgar_manifest.json \
            automation_intelligence/cl_lab/sec_edgar_research_context.json
          do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then echo "no SEC EDGAR state changes"; exit 0; fi
          staged="$(git diff --cached --name-only)"
          invalid="$(printf '%s\n' "$staged" | grep -Ev '^automation_intelligence/cl_lab/sec_edgar_(manifest|research_context)\.json$' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing out-of-scope SEC mutation:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi
          git commit -m "[SEC] EDGAR manifest and research context [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
