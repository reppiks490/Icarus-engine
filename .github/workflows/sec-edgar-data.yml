name: sec-edgar-data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cl_lab/feeds/sec_edgar.py"
      - "tests_cl/test_sec_edgar.py"
      - ".github/workflows/sec-edgar-data.yml"

permissions:
  contents: write

concurrency:
  group: sec-edgar-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" pytest

      - name: SEC EDGAR fixture tests
        run: python -m pytest -q tests_cl/test_sec_edgar.py -p no:cacheprovider

      - name: Restore SEC EDGAR cache
        uses: actions/cache/restore@v4
        with:
          path: .sec_edgar_cache
          key: sec-edgar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sec-edgar-

      - name: Refresh SEC EDGAR filings and XBRL
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
          ICARUS_SEC_CACHE: .sec_edgar_cache
          ICARUS_SEC_MANIFEST: automation_intelligence/cl_lab/sec_edgar_manifest.json
          ICARUS_SEC_TICKERS: ${{ vars.ICARUS_SEC_TICKERS }}
        run: python -m cl_lab.feeds.sec_edgar

      - name: Save SEC EDGAR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sec_edgar_cache
          key: sec-edgar-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit SEC EDGAR manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f automation_intelligence/cl_lab/sec_edgar_manifest.json ]; then
            git add automation_intelligence/cl_lab/sec_edgar_manifest.json
          fi
          if git diff --cached --quiet; then echo "no SEC EDGAR manifest changes"; exit 0; fi
          git commit -m "[SEC] EDGAR data manifest [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
