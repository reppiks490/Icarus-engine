name: sec-edgar-data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["restored-five-local-shadow"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "cl_lab/feeds/sec_edgar.py"
      - "tests_cl/test_sec_edgar.py"
      - "tests_cl/test_sec_edgar_context.py"
      - "config/credential_contract.json"
      - ".github/workflows/sec-edgar-data.yml"

permissions:
  contents: write

concurrency:
  group: sec-edgar-data
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      run_needed: ${{ steps.gate.outputs.run_needed }}
    steps:
      - name: Check out main for freshness gate
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Evaluate schedule-fallback freshness gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FALLBACK_MAX_AGE_SECONDS: '4500'
          FRESHNESS_MARKER: automation_intelligence/cl_lab/sec_edgar_manifest.json
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'workflow_run' ]; then
            echo 'run_needed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$UPSTREAM_EVENT" != 'schedule' ] || [ "$UPSTREAM_CONCLUSION" != 'success' ]; then
            echo 'run_needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_epoch="$(git log -1 --format=%ct -- "$FRESHNESS_MARKER" || true)"
          now_epoch="$(date -u +%s)"
          if [ -n "$last_epoch" ] && [ "$((now_epoch - last_epoch))" -lt "$FALLBACK_MAX_AGE_SECONDS" ]; then
            echo 'run_needed=false' >> "$GITHUB_OUTPUT"
            echo "SEC EDGAR state is fresh; fallback suppressed"
          else
            echo 'run_needed=true' >> "$GITHUB_OUTPUT"
            echo "SEC EDGAR state is stale or absent; fallback authorized"
          fi

  ingest:
    needs: freshness
    if: needs.freshness.outputs.run_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install "pandas>=2.2,<3" pytest

      - name: SEC EDGAR fixture and research-context tests
        run: python -m pytest -q tests_cl/test_sec_edgar.py tests_cl/test_sec_edgar_context.py -p no:cacheprovider

      - name: Restore SEC EDGAR cache
        uses: actions/cache/restore@v4
        with:
          path: .sec_edgar_cache
          key: sec-edgar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sec-edgar-

      - name: Refresh SEC EDGAR filings and XBRL
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || 'ICARUS Research tripleogdavid.102@gmail.com' }}
          ICARUS_SEC_CACHE: .sec_edgar_cache
          ICARUS_SEC_MANIFEST: automation_intelligence/cl_lab/sec_edgar_manifest.json
          ICARUS_SEC_CONTEXT: automation_intelligence/cl_lab/sec_edgar_research_context.json
          ICARUS_SEC_TICKERS: ${{ vars.ICARUS_SEC_TICKERS }}
        run: python -m cl_lab.feeds.sec_edgar

      - name: Save SEC EDGAR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sec_edgar_cache
          key: sec-edgar-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit SEC EDGAR manifest and research context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            automation_intelligence/cl_lab/sec_edgar_manifest.json \
            automation_intelligence/cl_lab/sec_edgar_research_context.json
          do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then echo "no SEC EDGAR state changes"; exit 0; fi
          staged="$(git diff --cached --name-only)"
          invalid="$(printf '%s\n' "$staged" | grep -Ev '^automation_intelligence/cl_lab/sec_edgar_(manifest|research_context)\.json$' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing out-of-scope SEC mutation:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi
          git commit -m "[SEC] EDGAR manifest and research context [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
