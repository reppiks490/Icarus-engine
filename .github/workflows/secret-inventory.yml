# Prints the NAMES of the repository secrets and variables this repo actually holds, never their values,
# so collectors can be wired to the names that exist. Provider receipts on 2026-10-10 reported
# BLOCKED_MISSING_CREDENTIAL for massive, twelve, alpaca, intrinio, quiver and tickstream although the
# owner reports those keys are stored in Actions: the stored names differ from the aliases the workflows read.
name: secret-inventory

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/secret-inventory.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: List secret and variable names (values never printed)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          for label, raw in (("secret", os.environ["SECRETS_JSON"]), ("variable", os.environ["VARS_JSON"])):
              data = json.loads(raw or "{}")
              for name in sorted(data):
                  value = data[name]
                  print(f"{label:8s} {name:40s} {'set' if value else 'EMPTY'} len={len(value) if isinstance(value, str) else '-'}")
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/environments",
                                       headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                                                "Accept": "application/vnd.github+json"})
          try:
              envs = json.load(urllib.request.urlopen(req)).get("environments", [])
              print("environments:", [e["name"] for e in envs] or "none")
          except Exception as ex:
              print("environments: unreadable", type(ex).__name__)
          PY
