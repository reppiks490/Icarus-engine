# Reports which credential NAMES are set as repository secrets or variables, never their values.
# Provider receipts on 2026-10-10 reported BLOCKED_MISSING_CREDENTIAL for massive, twelve, alpaca,
# intrinio, quiver and tickstream although the owner stores those keys in Actions, so the stored names
# differ from the aliases the collectors read. Each name is referenced explicitly (no toJSON(secrets)).
# Re-run 2026-10-11 (2) to confirm the owner-added keys.
name: secret-inventory

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/secret-inventory.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Which credential names are set (values never printed)
        env:
          S_ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          V_ALPACA_API_KEY: ${{ vars.ALPACA_API_KEY }}
          S_ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          V_ALPACA_API_KEY_ID: ${{ vars.ALPACA_API_KEY_ID }}
