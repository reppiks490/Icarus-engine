[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus-engine"
version = "1.0.0"
description = "One adaptive intraday liquidity-sweep system for equities, futures, forex and crypto"
requires-python = ">=3.11"
dependencies = []                      # the core runs on the standard library alone

[project.optional-dependencies]
dev = ["pytest>=8"]
# icarus_bridge/ and icarus_engine/server.py only. The engines and the
# entire 584-test suite run on the standard library plus pytest.
bridge = ["fastapi", "httpx", "mcp", "uvicorn"]

[project.scripts]
icarus = "icarus.cli:main"

[tool.setuptools.packages.find]
include = ["icarus*", "icarus_engine*", "icarus_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_engine"]
addopts = "-q"
